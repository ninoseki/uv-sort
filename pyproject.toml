[project]
name = "uv-sort"
dynamic = ["version"]
description = "Sort uv's dependencies alphabetically"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["uv"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["tomlrt>=2,<3", "typer>=0.15"]

[project.scripts]
uv-sort = "uv_sort.cli:app"

[project.urls]
Repository = "https://github.com/ninoseki/uv-sort"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv]
build-constraint-dependencies = [
    "dunamai==1.26.2",
    "hatchling==1.32.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
    "uv-dynamic-versioning==0.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-pretty>=1.3.0",
    "pytest-randomly>=4.1.0",
    "pytest>=9.1.1",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/uv_sort/_version.py"
template = '''
version = "{version}"
'''

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "W",   # pycodestyle warnings
]
ignore = ["E501"]
